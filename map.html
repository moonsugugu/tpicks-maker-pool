<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>현재 등록된 메이커 강사풀</title><meta name="description" content="티픽스 메이커 강사풀에 등록된 선생님을 시도·교육지원청별 지도로 볼 수 있습니다."><meta property="og:title" content="현재 등록된 메이커 강사풀"><meta property="og:description" content="티픽스 메이커 강사풀에 등록된 선생님을 시도·교육지원청별 지도로 볼 수 있습니다."><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.top{min-height:64px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px}.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:19px;letter-spacing:-.3px;padding:8px 14px;border-radius:12px;background:#fff;box-shadow:0 2px 12px rgba(30,20,60,.1)}.logo i{color:#4E9A06;font-style:normal}.tbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.tnav.ref{background:var(--ll);color:var(--ld)}.tnav.ref span{font-weight:700;opacity:.8}.tnav{font-size:14px;font-weight:800;padding:8px 14px;border-radius:999px;background:var(--pl);color:var(--p2)}
.hero{background-color:var(--p);background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:68px 68px;color:#fff}.hin{max-width:1080px;margin:0 auto;padding:40px 24px}.pill{display:inline-block;background:var(--l);color:var(--ld);font-size:11px;font-weight:900;letter-spacing:.8px;padding:5px 11px;border-radius:999px}.hero h1{margin:14px 0 8px;font-size:clamp(28px,4.4vw,42px);font-weight:900;letter-spacing:-1px}.hero p{margin:0;font-size:16px;opacity:.92}.hlink{display:inline-block;margin-top:16px;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:14px}.hlink:hover{background:rgba(255,255,255,.26)}

.mapcard{position:relative}.sync{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;background:rgba(255,255,255,.86);border-radius:22px;text-align:center}.sync[hidden]{display:none}.sync i{width:46px;height:46px;border-radius:50%;border:4px solid var(--pl);border-top-color:var(--p);animation:spin .9s linear infinite}.sync b{font-size:17px;font-weight:900}.sync span{font-size:13px;color:var(--m)}.sync button{margin-top:4px;font:inherit;font-size:14px;font-weight:800;color:#fff;background:var(--p);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}.sync.err i{animation:none;border-color:#F2A9AC;border-top-color:#E5484D}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.sync i{animation-duration:2.4s}}.card{background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px;box-shadow:0 1px 3px rgba(20,10,50,.04)}
.mhead{display:flex;align-items:center;gap:10px;min-height:36px;margin-bottom:8px}.mhead b{font-size:18px;font-weight:900}.back{border:1.5px solid var(--b);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;cursor:pointer}.back:hover{border-color:var(--pb);background:var(--pl)}
svg{display:block;width:100%;height:auto;max-height:72vh}.rg{fill:#EFEAFB;stroke:#fff;stroke-width:1.5;cursor:pointer;transition:fill .15s,opacity .15s}.rg:hover{fill:#E2D8FF}.rg.on{fill:#E6DCFF;cursor:default}.rg.dim{opacity:.35}.mu{fill:none;stroke:#fff;stroke-width:1.2;pointer-events:none}

.dot circle,.rg,.mu{vector-effect:non-scaling-stroke}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.chip{border:1.5px solid var(--b);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}.chip:hover{border-color:var(--pb);background:var(--pl)}.chip.zero{color:#AAA6B8}.chip.on{background:var(--ll);border-color:var(--lb);color:var(--ld)}.chip b{color:var(--p);margin-left:3px}.chip.zero b{color:#C9C5D6}.chip.on b{color:var(--ld)}
.side{position:sticky;top:16px}.side h2{margin:0 0 4px;font-size:22px;font-weight:900;letter-spacing:-.5px}.side h2 small{font-size:15px;color:var(--p);margin-left:6px}.muted{color:var(--m);font-size:14px;line-height:1.6;margin:0}
.top-score{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:22px;border:1.5px solid var(--lb);background:var(--ll);color:var(--ld);border-radius:14px;padding:15px 18px;font-size:16px;font-weight:900;cursor:pointer}.top-score:hover{background:#E8F8BC}.top-score:disabled{opacity:.55;cursor:wait}.top-score:focus-visible,.rank-item:focus-visible,.back:focus-visible{outline:3px solid var(--p);outline-offset:3px}.score-rule{margin-top:14px;font-size:12px;line-height:1.7;color:var(--m)}.ranking{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}.rank-item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--b);border-radius:14px;background:#fff;padding:13px 12px;cursor:pointer}.rank-item:hover,.rank-item.on{background:var(--pl);border-color:var(--pb)}.rank-no{font-size:17px;font-weight:900;color:var(--p);text-align:center}.rank-main{min-width:0}.rank-main strong{display:block;font-size:15px;font-weight:900;overflow-wrap:anywhere}.rank-main small{display:block;margin-top:3px;font-size:12px;line-height:1.5;color:var(--m);overflow-wrap:anywhere}.rank-points{color:var(--p2);font-size:18px;font-weight:900;white-space:nowrap}.rank-points.pending{color:var(--m);font-size:12px}.score-breakdown{display:flex;flex-wrap:wrap;gap:6px}.score-breakdown span{background:var(--bg);border-radius:8px;padding:5px 9px;font-size:13px}.rank-back{margin-bottom:16px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}.name{border:1.5px solid var(--b);background:#fff;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:800;cursor:pointer}.name small{display:block;font-size:11px;font-weight:700;color:var(--m);margin-top:2px}.name:hover{border-color:var(--pb);background:var(--pl)}.name.on{background:var(--p);border-color:var(--p);color:#fff}.name.on small{color:#E6DCFF}
.who{margin-top:18px;border-top:1px solid var(--b);padding-top:18px}.who h3{margin:0 0 12px;font-size:20px;font-weight:900}.row{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:8px 0;font-size:15px;line-height:1.6}.row>span{color:var(--m);font-weight:700;font-size:14px}.intro{white-space:pre-line}.cs{display:flex;flex-direction:column;gap:6px}.c{background:var(--bg);border-radius:10px;padding:8px 12px}.cb{display:inline-block;margin-left:6px;vertical-align:2px;background:var(--ll);color:var(--ld);border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px}.name.on .cb{background:rgba(255,255,255,.22);color:#fff}.c strong{display:block;margin:6px 0 2px;font-weight:800}.tgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.tg{background:var(--pl);color:var(--p2);border-radius:999px;font-size:12px;font-weight:800;padding:2px 9px}.tg.md{background:#E7F1FF;color:#1D5FBF}.tg.df{background:#FFF1DE;color:#A15A00}.c em{font-style:normal;color:var(--m);font-size:14px}.c b{display:inline-block;background:var(--ll);color:var(--ld);border-radius:999px;font-size:12px;padding:2px 9px;margin-right:6px}
footer{text-align:center;color:var(--m);font-size:12px;padding:0 16px 40px}
@media(max-width:760px){main{grid-template-columns:1fr}.side{position:static}.top{padding:10px 12px}.logo{font-size:16px;padding:7px 10px}.tnav{font-size:13px;padding:7px 11px}}
</style></head>
<body><header class="top"><a class="logo" href="./"><i>↖</i>TPICKS LABS</a><nav class="tbtns"><a class="tnav ref" href="analysis.html"><span>어떤 연수를 할지 모르겠다면?</span> 연수 레퍼런스 찾기</a><a class="tnav" href="./">메이커 강사 등록하기</a></nav></header>
<div class="hero"><div class="hin"><span class="pill">MAKER POOL MAP</span><h1>현재 등록된 메이커 강사풀</h1><p id="total">등록된 선생님을 불러오는 중입니다…</p></div></div>
<main><div class="card mapcard"><div class="sync" id="sync" role="status" aria-live="polite"><i aria-hidden="true"></i><b>강사풀을 불러오는 중이에요</b><span>시트에서 최신 등록 정보를 가져오고 있어요</span></div><div class="mhead" id="mhead"></div><svg id="map" viewBox="0 0 520 548" role="group" aria-label="메이커 강사 지도"></svg><div class="chips" id="chips"></div></div>
<div class="card side" id="side"></div></main>
<footer>TPICKS 메이커 강사풀 · 연락처는 공개하지 않습니다.</footer>
<script src="edu.js"></script><script src="map-geo.js"></script>
<script>
var API='https://script.google.com/macros/s/AKfycbzezb8Vh2q77N5Tl2nuxx0BVQhqDtFfZ7ujHkG5DAJs-15P7soKd8mrFaKS_1WZa7GduA/exec';
var ETC='지역 미상',HQ='본청·직속기관',NOSUB='교육지원청 미상',NS='http://www.w3.org/2000/svg',VB0=[0,0,520,548];
// 시도를 찾을 말: 짧은 이름 + 옛 정식 이름 앞부분
var LONG={충북:'충청북',충남:'충청남',전북:'전라북',전남:'전라남',경북:'경상북',경남:'경상남'};
// 시도 없이 써도 알아볼 수 있는 교육지원청 이름(두 시도 이상에 있는 '동부', '고성' 등은 뺌)
var UNIQ={};EDU.forEach(function(e){e[4].forEach(function(s){s[3].forEach(function(w){UNIQ[w]=UNIQ.hasOwnProperty(w)&&(!UNIQ[w]||UNIQ[w][0]!==e)?null:[e,s[0]]})})});
var by={},cur=null,sub=null,pool=[],loaded=false,view='intro';
function first(s,words){var b=-1;words.forEach(function(w){var i=s.indexOf(w);if(i>=0&&(b<0||i<b))b=i});return b}
// 소속 교육청·근무지 글자로 [시도, 교육지원청]을 정한다. 여러 개가 걸리면 글에서 가장 앞에 나온 것('경기도광주하남…'은 경기)
function locate(t){var s=(t.office||'')+' '+(t.school||''),e=null,bi=-1;
 EDU.forEach(function(x){var i=first(s,[x[0],LONG[x[0]]].filter(Boolean));if(i>=0&&(bi<0||i<bi)){bi=i;e=x}});
 if(!e){var hit=null;bi=-1;for(var w in UNIQ){var i=UNIQ[w]?s.indexOf(w):-1;if(i>=0&&(bi<0||i<bi)){bi=i;hit=UNIQ[w]}}return hit?[hit[0][0],hit[1]]:[ETC,null]}
 var nm=null;bi=first(s,['본청','직속']);if(bi>=0)nm=HQ;
 e[4].forEach(function(x){var i=first(s,x[3]);if(i>=0&&(bi<0||i<bi)){bi=i;nm=x[0]}});return [e[0],nm||NOSUB]}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function sv(tag,at){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);return e}
function edu(k){return EDU.filter(function(e){return e[0]===k})[0]}
function short(s){return s.replace('교육지원청','')}
function people(k,s){return (by[k]||[]).filter(function(t){return !s||t.sub===s})}
function chip(box,label,n,on,fn){var c=el('button','chip'+(on?' on':'')+(n?'':' zero'),label);c.type='button';c.appendChild(el('b',null,n));c.onclick=fn;box.appendChild(c)}
// u: 확대했을 때 점·글자 크기를 화면 기준으로 맞추는 배율
function dot(svg,x,y,n,label,on,u,fn){var g=sv('g',{'class':'dot'+(on?' on':''),tabindex:0,role:'button','aria-label':label+' '+n+'명'}),r=(11+Math.min(n,20)*.5)*u;
 g.appendChild(sv('circle',{cx:x,cy:y,r:r}));var tx=sv('text',{x:x,y:y,'font-size':13*u});tx.textContent=n;g.appendChild(tx);
 if(cur){var lb=sv('text',{x:x,y:y+r+9*u,'class':'lb','font-size':12*u});lb.textContent=label;g.appendChild(lb)}
 var tt=sv('title',{});tt.textContent=label+' '+n+'명';g.appendChild(tt);g.onclick=fn;g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}};svg.appendChild(g)}
function draw(){var svg=document.getElementById('map'),chips=document.getElementById('chips'),mh=document.getElementById('mhead'),e=cur&&cur!==ETC&&edu(cur),on=null;
 svg.textContent='';chips.textContent='';mh.textContent='';svg.setAttribute('viewBox',VB0.join(' '));
 EDU.forEach(function(x){var p=sv('path',{d:PROV[x[0]],'class':'rg'+(e===x?' on':e?' dim':'')});if(e===x)on=p;p.onclick=function(){if(e!==x)pick(x[0])};svg.appendChild(p)});
 if(!e){mh.appendChild(el('b',null,'전국'));
  EDU.concat([[ETC]]).forEach(function(x){var n=people(x[0]).length;if(x[0]===ETC&&!n)return;chip(chips,x[0],n,cur===x[0],function(){pick(x[0])});if(n&&x[0]!==ETC)dot(svg,x[2],x[3],n,x[0],false,1,function(){pick(x[0])})});return}
 var bb=on.getBBox(),pad=Math.max(bb.width,bb.height)*.08,vb=[bb.x-pad,bb.y-pad,bb.width+pad*2,bb.height+pad*2],u=Math.max(vb[2]/VB0[2],vb[3]/VB0[3]);
 svg.setAttribute('viewBox',vb.join(' '));svg.appendChild(sv('path',{d:MUNI[e[0]],'class':'mu'}));
 var back=el('button','back','← 전국 지도');back.type='button';back.onclick=function(){pick(null)};mh.appendChild(back);mh.appendChild(el('b',null,e[1]));
 chip(chips,'전체',people(cur).length,!sub,function(){pickSub(null)});
 e[4].map(function(s){return [s[0]+'교육지원청',s[1],s[2]]}).concat([[HQ,e[2],e[3]],[NOSUB,e[2],e[3]]]).forEach(function(s){var n=people(cur,s[0]).length,go=function(){pickSub(s[0])};
  if(n||s[0]!==HQ&&s[0]!==NOSUB)chip(chips,short(s[0]),n,sub===s[0],go);if(n)dot(svg,s[1],s[2],n,short(s[0]),sub===s[0],u,go)})}
function pick(k){cur=k;sub=null;view=k?'region':'intro';draw();if(!k)intro();else list(k===ETC?ETC:edu(k)[1],people(k))}
function pickSub(s){sub=s;view='region';draw();list(edu(cur)[1]+(s?' · '+short(s):''),people(cur,s));if(s&&innerWidth<=760)document.getElementById('side').scrollIntoView({behavior:'smooth'})}
function intro(){view='intro';var side=document.getElementById('side');side.textContent='';side.appendChild(el('h2',null,'시도를 골라 주세요'));side.appendChild(el('p','muted','지도의 점이나 시도 이름을 누르면 그 지역이 커지고, 교육지원청별로 메이커 강사 선생님을 볼 수 있습니다.'));}
function list(title,ls){var side=document.getElementById('side');side.textContent='';var h=el('h2',null,title);h.appendChild(el('small',null,ls.length+'명'));side.appendChild(h);
 if(!ls.length){side.appendChild(el('p','muted','아직 이 지역에 등록된 메이커 강사가 없습니다.'));return}
 side.appendChild(el('p','muted','이름을 누르면 자세한 소개가 나옵니다.'));var ns=el('div','names'),who=el('div','who');who.hidden=true;
 ls.forEach(function(t){var b=el('button','name',t.name);b.type='button';if(cur!==ETC&&!sub&&t.sub)b.appendChild(el('small',null,short(t.sub)));b.onclick=function(){ns.querySelectorAll('.name').forEach(function(x){x.classList.toggle('on',x===b)});show(who,t)};ns.appendChild(b)});
 side.appendChild(ns);side.appendChild(who);if(ls.length===1)ns.firstChild.click()}
function show(who,t){who.hidden=false;who.textContent='';var h3=el('h3',null,t.name+' 선생님');who.appendChild(h3);
 [['소속 교육청',t.office],['근무지',t.school],['자기소개',t.intro]].forEach(function(r){var d=el('div','row');d.appendChild(el('span',null,r[0]));d.appendChild(el('div',r[0]==='자기소개'?'intro':null,r[1]||'—'));who.appendChild(d)});
 var d=el('div','row'),cs=el('div','cs');d.appendChild(el('span',null,'가능 연수'));(t.courses||[]).forEach(function(c){var x=el('div','c');x.appendChild(el('b',null,c.cat));x.appendChild(el('strong',null,c.title||''));x.appendChild(el('em',null,c.tool));var tg=el('div','tgs');(c.target?String(c.target).split(', '):[]).forEach(function(t){tg.appendChild(el('span','tg',t))});(c.mode?String(c.mode).split(', '):[]).forEach(function(t){tg.appendChild(el('span','tg md',t))});if(c.diff)tg.appendChild(el('span','tg df',c.diff));if(tg.firstChild)x.appendChild(tg);cs.appendChild(x)});if(!cs.firstChild)cs.textContent='—';d.appendChild(cs);who.appendChild(d)}
intro();draw();
fetch(API+'?list=1').then(function(r){return r.json()}).then(function(ls){
 if(!Array.isArray(ls))throw new Error('Invalid pool response');pool=ls;
 ls.forEach(function(t){var w=locate(t);t.sub=!w[1]||w[1]===HQ||w[1]===NOSUB?w[1]||'':w[1]+'교육지원청';(by[w[0]]=by[w[0]]||[]).push(t)});
 for(var k in by)by[k].sort(function(a,b){return a.name.localeCompare(b.name,'ko')});
 loaded=true;document.getElementById('sync').hidden=true;document.getElementById('total').textContent=ls.length?'지금까지 '+ls.length+'명의 선생님이 등록했습니다.':'아직 등록된 선생님이 없습니다. 첫 번째로 등록해 주세요!';draw();if(view==='intro')intro();else list(edu(cur)?edu(cur)[1]+(sub?' · '+short(sub):''):ETC,people(cur,sub))
}).catch(function(){document.getElementById('total').textContent='목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';var s=document.getElementById('sync');s.className='sync err';s.querySelector('b').textContent='강사풀을 불러오지 못했어요';s.querySelector('span').textContent='인터넷 연결을 확인한 뒤 다시 시도해 주세요.';var b=document.createElement('button');b.type='button';b.textContent='다시 불러오기';b.onclick=function(){location.reload()};s.appendChild(b)});
</script></body></html>
