 var d=el('div','row'),cs=el('div','cs');d.appendChild(el('span',null,'가능 연수'));(t.courses||[]).forEach(function(c){var x=el('div','c');x.appendChild(el('b',null,c.cat));x.appendChild(document.createTextNode(c.tool));cs.appendChild(x)});if(!cs.firstChild)cs.textContent='—';d.appendChild(cs);who.appendChild(d)}
function draw(){var svg=document.getElementById('map'),chips=document.getElementById('chips');
 RG.forEach(function(r){var p=sv('path',{d:PATHS[r[1]],'class':'rg','data-k':r[0]});p.onclick=function(){pick(r[0])};svg.appendChild(p)});
 RG.concat([[ETC]]).forEach(function(r){var n=(by[r[0]]||[]).length;if(r[0]===ETC&&!n)return;var c=el('button','chip',r[0]);c.type='button';c.setAttribute('data-k',r[0]);c.appendChild(el('b',null,n));c.onclick=function(){pick(r[0])};chips.appendChild(c);
  if(!n||r[0]===ETC)return;var q=xy(r[2],r[3]),g=sv('g',{'class':'dot',tabindex:0,role:'button','aria-label':r[0]+' '+n+'명','data-k':r[0]});
  g.appendChild(sv('circle',{cx:q[0],cy:q[1],r:11+Math.min(n,20)*.5}));var tx=sv('text',{x:q[0],y:q[1]});tx.textContent=n;g.appendChild(tx);var tt=sv('title',{});tt.textContent=r[0]+' '+n+'명';g.appendChild(tt);
  g.onclick=function(){pick(r[0])};g.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(r[0])}};svg.appendChild(g)})}
fetch(API+'?list=1').then(function(r){return r.json()}).then(function(list){

 document.getElementById('total').textContent=list.length?'지금까지 '+list.length+'명의 선생님이 등록했습니다.':'아직 등록된 선생님이 없습니다. 첫 번째로 등록해 주세요!';draw()
}).catch(function(){document.getElementById('total').textContent='목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';draw()});
