 .hero-heading{font-size:clamp(23px,3.8vw,31px)}
 .hero-copy p{font-size:12px;margin-top:6px}
 .hero-actions{grid-column:1/-1}
}
@media(max-width:560px){
 .hero-inner{padding:19px 16px 22px;grid-template-columns:1fr;gap:9px}
 .hero-label{font-size:9px}
 .hero-word{font-size:clamp(65px,17vw,85px);line-height:1.01}
 .hero-logo-caption{display:none}
 .hero-copy{margin-top:0}
 .hero-heading{font-size:25px;line-height:1.18}
 .hero-heading br{display:none}
 .hero-copy p{font-size:11px;line-height:1.45;margin-top:5px}
 .hero-actions{grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}
 .hero-action{min-height:71px;padding:10px 11px;gap:4px;border-radius:12px}
 .hero-action span:not(.arrow){font-size:9px}
 .hero-action strong{font-size:12px;line-height:1.35;letter-spacing:-.3px;padding-right:12px}
 .hero-action .arrow{font-size:16px;right:8px;top:27px}
 body:has(.hero) .content-wrap{padding-top:20px}
 .search-heading h2{font-size:22px}
 .search-heading{margin-bottom:10px}
}

/* 입력 폼 / 모달 접근성 보완 */
.modal:focus{outline:none}
.modal :focus-visible,.partner-item button:focus-visible{outline:3px solid #adff4f;outline-offset:3px}
.partner-item-foot{flex-wrap:wrap;gap:8px}
@media (max-width:620px){.partner-item-foot button{min-height:40px}}

/* 지원서 상단 닫기 버튼: 긴 지원서에서도 스크롤 중 접근 가능 */
.apply-modal-toolbar{position:sticky;top:-25px;z-index:4;display:flex;justify-content:flex-end;align-items:center;background:#fff;padding:6px 0 12px;margin:-6px 0 4px}
@media(max-width:700px){.apply-modal-toolbar{top:-18px}}

/* Navigation text refinement */
.space-tabs-inner{justify-content:space-between}.space-tabs-inner>.space-tabs-title{white-space:nowrap}.space-tab-links{margin-left:auto}

/* Recruitment details: compact fact rows, used for every current and future posting. */
.detail-facts{border-top:1px solid var(--line);margin-top:18px}
.detail-fact{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.detail-fact h3{font-size:14px;font-weight:900;margin:0;color:var(--ink);line-height:1.7}
.detail-fact p{margin:0;white-space:pre-line;line-height:1.7;color:#586578;font-size:14px;overflow-wrap:anywhere}
.job-modal-content .detail-facts{margin-top:17px}
.job-modal-content .detail-fact{padding:13px 0}
@media(max-width:520px){.detail-fact{grid-template-columns:84px minmax(0,1fr);gap:10px}.detail-fact h3,.detail-fact p{font-size:13px}}

.recruit-top{padding:12px max(18px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line)}.recruit-brand{font-weight:950;font-size:20px;color:var(--ink);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}.logo-img{height:18px;width:auto;display:block}@media(max-width:760px){.logo-img{height:18px}}.recruit-top>div{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.recruit-top .btn{text-decoration:none}.recruit-email{font-size:12px;color:var(--muted);overflow-wrap:anywhere}#recruitCodeSection{margin-top:20px}[hidden]{display:none!important}@media(max-width:600px){.recruit-top{align-items:flex-start}.recruit-top>div{max-width:62%}.recruit-brand{font-size:16px}}

<body class="tone-recruit"><header id="recruitHeader" class="recruit-top"></header>
<main id="root"></main><div class="footer-note">© TPICKS · 전문가 모집 · 지원서는 본인과 해당 공고 담당자, 운영자만 확인할 수 있습니다. · <a href="privacy.html">개인정보 처리방침</a></div><div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const SCHOOL_LEVELS=['유치원','초등','중등','고등','특수'];
const seoulDay=(value=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
const today=()=>seoulDay();
const submittedDay=x=>{try{return seoulDay(x)}catch(e){return ''}};
function load(){return {jobs:[],apps:[],requests:[],profile:{name:"",level:""},history:[]}}

let db=load();db.requests ||= [];let page=(['home','jobs','mine','company','partner','admin'].includes(location.hash.slice(1))?location.hash.slice(1):'home'),selected='j1',search='',typeFilter='',levelFilter='',editId=null,adminJob='j1',adminLevel='',adminField='';
function el(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return esc(s)}
function showDate(x){return /^\d{4}-\d{2}-\d{2}$/.test(String(x||''))?esc(x.replaceAll('-','.')):'별도 안내'}
function isOpen(j){return j.published&&j.deadline>=today()}
function toast(msg){el('toastRoot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{if(el('toastRoot'))el('toastRoot').innerHTML=''},2700)}
function jobCard(j){return `<article class="job" data-select="${attr(j.id)}" role="button" tabindex="0" aria-label="${attr(j.title)} 상세 공고 보기"><div class="job-top"><div class="pills"><span class="pill ${isOpen(j)?'open':'closed'}">${isOpen(j)?'모집 중':'모집 마감'}</span><span class="pill">${esc(j.type)}</span></div><span style="color:#a3a8b4">›</span></div><h3>${esc(j.title)}</h3><p>${esc(j.company)}</p><div class="job-meta"><span>🏫 ${esc(j.levels.join(' · '))}</span><span>👥 ${esc(j.seats)}</span><span>💰 <b>${esc(j.fee)}</b></span><span>📅 ~ ${showDate(j.deadline)}</span></div></article>`}
function jobsView(){const visible=db.jobs.filter(j=>j.published).filter(j=>(j.title+j.company+j.summary).toLowerCase().includes(search.toLowerCase())).filter(j=>!typeFilter||j.type===typeFilter).filter(j=>!levelFilter||j.levels.includes(levelFilter)).sort((a,b)=>Number(isOpen(b))-Number(isOpen(a))||a.deadline.localeCompare(b.deadline));return `<div class="section-intro search-heading"><h2>공고 검색</h2></div><div class="toolbar"><input class="field" id="search" aria-label="공고명 또는 주제 검색" placeholder="공고명·주제 검색" value="${attr(search)}"><select id="typeFilter" class="select" aria-label="업무 유형"><option value="">모든 업무 유형</option>${['연수 강사','콘텐츠 제작·집필','검수·검토','자문위원'].map(x=>`<option ${typeFilter===x?'selected':''}>${x}</option>`).join('')}</select><select id="levelFilter" class="select" aria-label="학교급"><option value="">모든 학교급</option>${SCHOOL_LEVELS.map(x=>`<option ${levelFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div id="jobResults" aria-live="polite"><div class="listing-header"><strong>모집 공고</strong><span>전체 ${visible.length}건</span></div><div class="job-card-grid">${visible.length?visible.map(jobCard).join(''):'<div class="panel empty" style="grid-column:1/-1">조건에 맞는 공고가 없습니다.</div>'}</div></div>`}
function updateJobResults(){const holder=el('jobResults');if(!holder)return;const tpl=document.createElement('template');tpl.innerHTML=jobsView();const updated=tpl.content.querySelector('#jobResults');if(!updated)return;holder.replaceChildren(...Array.from(updated.childNodes));bindJobCards(holder)}
function bindJobCards(scope=document){scope.querySelectorAll('[data-select]').forEach(x=>{x.onclick=()=>openJobDetails(x.dataset.select);x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openJobDetails(x.dataset.select)}}})}
function detailPanel(j){
 const facts=[
  ['업무 내용',j.tasks||'공고 상세 확인'],
  ['지원 자격',j.qualification||'공고 상세 확인'],
  ['진행 일정',j.period||'개별 안내'],
  ['선발 절차',j.process||'지원서 검토 후 개별 안내']
 ];
 const factRows=facts.map(([name,value])=>`<div class="detail-fact"><h3>${esc(name)}</h3><p>${esc(value)}</p></div>`).join('');
 return `<section class="panel" id="detail"><div class="detail"><div class="pills"><span class="pill ${isOpen(j)?'open':'closed'}">${isOpen(j)?'모집 중':'모집 마감'}</span><span class="pill">${esc(j.type)}</span></div><div class="detail-head"><h2>${esc(j.title)}</h2><div class="company">${esc(j.company)}</div></div><div class="info-grid"><div class="info"><span>모집 대상</span><strong>${esc(j.levels.join(' · '))}</strong></div><div class="info"><span>모집 인원</span><strong>${esc(j.seats)}</strong></div><div class="info"><span>사례비</span><strong>${esc(j.fee)}</strong></div><div class="info"><span>마감일</span><strong>${showDate(j.deadline)}</strong></div></div><div class="detail-facts">${factRows}</div>${j.additionalDetails?`<div class="detail-section"><h3>추가 안내 사항</h3><p>${esc(j.additionalDetails)}</p></div>`:''}<div class="job-share-actions"><button class="btn ghost" type="button" data-share-job="${attr(j.id)}">↗ 공고 공유하기</button><span class="share-help">카카오톡 등으로 모집 정보를 공유할 수 있어요.</span></div>${myApplications().some(a=>a.jobId===j.id)?'<div class="status">✓ 이 공고에 지원한 내역이 있습니다. 내 지원 내역에서 수정할 수 있습니다.</div>':''}${isOpen(j)?`<div class="action-bar"><button class="btn primary" data-apply="${attr(j.id)}">${myApplications().some(a=>a.jobId===j.id)?'내 지원서 확인':'간편 지원하기'} →</button></div>`:'<div class="warning">이 공고는 모집이 마감되었습니다.</div>'}</div></section>`;
}
function applicationForm(j,a){const f=a||{};const h=(db.history||[]).slice().reverse();return `<form id="appForm"><div class="subhead">${a?'지원서 수정':'간편 지원'}</div><p class="form-help">지원 분야 관련 이력과 지원 동기를 작성해 주세요.</p><div class="form-group"><label>성함 <span class="req">*</span></label><input class="field" name="name" required maxlength="40" placeholder="이름을 입력해 주세요" value="${attr((f.name??db.profile.name)==="김티픽"?"":(f.name??db.profile.name))}"></div><div class="form-group"><label>연락처 <span class="req">*</span></label><input type="tel" name="phone" class="field" required maxlength="24" inputmode="tel" pattern="0[0-9]{1,2}-?[0-9]{3,4}-?[0-9]{4}" title="숫자와 하이픈으로 입력해 주세요. 예: 010-1234-5678" placeholder="예: 010-1234-5678" value="${attr(f.phone??db.profile.phone??'')}"><span class="hint">선발 안내를 받을 연락처를 입력해 주세요.</span></div><div class="form-group"><label>이메일 <span class="req">*</span></label><input type="email" name="email" class="field" required maxlength="120" placeholder="예: name@example.com" value="${attr(f.email??db.profile.email??'')}"></div><div class="form-group"><label>학교급 <span class="req">*</span></label><select class="select" name="level" required><option value="">선택해 주세요</option>${j.levels.map(l=>`<option value="${attr(l)}" ${l===(f.level??db.profile.level)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>${j.fields.length?`<div class="form-group"><label>희망 분야 <span class="req">*</span></label><select class="select" name="field" required><option value="">분야 선택</option>${j.fields.map(v=>`<option ${f.field===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`:''}${applicantQuestionFields(j,f)}<div class="divider"></div><div class="flex" style="justify-content:space-between"><h3 style="margin:0 0 14px">지원 분야 관련 이력 <span class="req">*</span></h3>${h.length?'<button type="button" class="btn ghost small" id="loadHistory">이전 이력 불러오기</button>':''}</div><div class="form-group"><label for="relevantExperience">지원 분야 관련 이력 <span class="req">*</span></label><textarea id="relevantExperience" name="description" required maxlength="1600" class="textarea" rows="6" placeholder="예: 교육청 AI 활용 연수 8차시 강의 및 교사용 자료 개발">${esc(f.description||[f.activity,f.additional].filter(Boolean).join('\n')||'')}</textarea><span class="hint">지원 분야와 관련된 주요 경험을 적어 주세요.</span></div><div class="form-group"><label for="appMessage">지원 동기 및 자기소개 <span class="req">*</span></label><textarea id="appMessage" name="appMessage" required class="textarea" rows="5" maxlength="1500" placeholder="예: 지원 동기, 프로젝트에 임하는 자세, 자신의 강점, 관련 프로젝트 경험 등을 작성해 주세요.">${esc(f.appMessage||'')}</textarea><span class="hint">지원 동기와 자신의 강점, 프로젝트에 기여할 수 있는 점 등을 작성해 주세요.</span></div><div class="form-group"><label>저서 (선택)</label><input name="books" class="field" maxlength="160" placeholder="예: 《교실 속 민주주의》 외 2권" value="${attr(f.books||'')}"><span class="hint">대표 저서명과 추가 권수만 간단히 적어 주세요. 저서가 없다면 비워도 됩니다.</span></div><div class="form-group"><label>자신이 운영하는 SNS 및 채널 (선택 · 1개)</label><input name="snsName" class="field" maxlength="80" placeholder="채널명 (예: 교실 속 역사 이야기)" value="${attr(f.snsName||'')}"><input name="snsUrl" class="field" type="url" maxlength="400" placeholder="https:// (채널 링크, 최대 1개)" value="${attr(f.snsUrl||'')}" style="margin-top:9px"><span class="hint">활동을 확인할 수 있는 SNS 또는 채널이 있다면 하나만 적어 주세요.</span></div><div class="form-group"><label>포트폴리오 링크 (선택)</label><input name="portfolio" class="field" type="url" maxlength="400" placeholder="https://" value="${attr(f.portfolio||'')}"></div><section class="consent-box" aria-label="개인정보 수집 및 제공 동의"><h3>동의하고 제출하기</h3><p class="consent-lead">티픽스 전문가 모집 공고 지원과 선발 심사를 위해 아래 내용을 확인해 주세요.</p><div class="consent-summary"><p><b>수집·이용 항목</b>성함, 연락처, 이메일, 학교급, 희망 분야, 대표 경력, 지원 자격 확인 답변 및 지원자가 선택해 입력한 관련 이력·저서·SNS·포트폴리오·추가 전달 내용</p><p><b>이용 목적</b>지원 접수 및 자격·경력 검토, 지원 현황 관리, 선발 결과 안내</p><p><b>제공받는 자</b>${esc(j.company)}의 권한 있는 모집 담당자<br><b>제공받는 자의 이용 목적</b>해당 공고의 지원 자격 및 경력 심사, 선발 결과 안내<br><b>제공 항목</b>성함, 연락처, 이메일, 학교급, 희망 분야, 대표 경력, 추가 질문 답변, 지원자가 직접 입력한 관련 이력·저서·SNS·포트폴리오·추가 내용<br><b>제공받는 자의 보유·이용 기간</b>해당 모집의 지원·선발 업무 종료 또는 지원 철회 시까지 이용합니다.</p><p><b>보유·이용 기간</b>해당 모집의 지원·선발 업무 종료 또는 지원 철회 시까지 보관합니다. 운영자가 선발 종료 처리하면 해당 공고의 지원서는 삭제됩니다.</p><p><b>동의 거부 권리 및 불이익</b>동의를 거부할 수 있으나, 필수 정보 수집 및 심사 목적의 제공에 동의하지 않으면 해당 모집 공고에 지원할 수 없습니다.<br><b>공개 범위</b>지원서와 연락 정보는 일반 이용자에게 공개되지 않으며, 강사 인력풀·메이커 소개 목적으로 사용되지 않습니다.</p></div><label class="consent-check"><input type="checkbox" name="agreeCollection" required ${a?'checked':''}><span>위 개인정보 수집·이용 안내를 확인하고 동의합니다. <b>(필수)</b></span></label><label class="consent-check"><input type="checkbox" name="agreeSharing" required ${a?'checked':''}><span>지원 심사를 위해 해당 공고 의뢰 업체의 담당자에게 지원 내용을 제공하는 데 동의합니다. <b>(필수)</b></span></label><p class="consent-notice">동의하지 않으면 지원서를 제출할 수 없습니다. 지원서는 본인과 해당 공고 담당자, 티픽스 운영자만 확인할 수 있으며 공개 강사풀에는 등록되지 않습니다.</p></section><div class="action-bar"><button class="btn" type="button" id="cancelApply">취소</button><button type="submit" class="btn primary">${a?'동의하고 수정 저장':'동의하고 지원서 제출하기'}</button></div></form>`}
function myView(){return `<div class="intro"><div><div class="eyebrow">✦ ✦ ✦ &nbsp; MY APPLICATIONS</div><h1>내 지원 내역</h1><p>제출한 지원서를 확인하고 마감 전까지 수정할 수 있습니다.</p></div></div>${!myApplications().length?'<div class="panel empty">아직 지원한 공고가 없습니다.<br><br><button class="btn primary" data-nav="jobs">모집 공고 보기</button></div>':`<div class="my-list">${myApplications().slice().reverse().map(a=>{let j=db.jobs.find(j=>j.id===a.jobId);return `<article class="my-item"><div class="my-top"><span class="pill ${a.status==='선발'?'open':''}">${esc(a.status||'접수 완료')}</span><span class="my-meta">접수일 ${showDate(submittedDay(a.submittedAt))}</span></div><h3>${esc(j?.title||'삭제된 공고')}</h3><div class="my-meta">${esc(a.level)} · ${esc(a.field||'공통')}</div><div class="my-content"><b>${esc(a.activity)}</b><div>${esc(a.description)}</div>${normalizedQuestions(j||{}).filter(q=>a.questionAnswers?.[q.id]).map(q=>`<div class="application-extra">${esc(q.label)}: ${esc(a.questionAnswers[q.id])}</div>`).join('')}${a.additional?`<div class="application-extra">관련 이력: ${esc(a.additional)}</div>`:``}${a.books?`<div class="application-extra">저서: ${esc(a.books)}</div>`:``}${a.snsName?`<div class="application-extra">SNS: ${esc(a.snsName)}</div>`:``}${a.appMessage?`<div class="application-extra" style="white-space:pre-wrap"><b>지원 동기 및 자기소개:</b> ${esc(a.appMessage)}</div>`:``}</div><div class="flex">${j&&isOpen(j)?`<button class="btn small" data-edit="${attr(a.id)}">지원서 수정</button><button class="btn danger small" data-withdraw="${attr(a.id)}">지원 철회</button>`:''}${j?`<button class="btn small" data-open-job="${attr(j.id)}">공고 보기</button>`:''}</div></article>`}).join('')}</div>`}`}
function adminView(){const job=db.jobs.find(j=>j.id===adminJob)||db.jobs[0];const apps=db.apps.filter(a=>a.jobId===job?.id&&(!adminLevel||a.level===adminLevel)&&(!adminField||a.field===adminField));return `<div class="intro"><div><h1>운영자 관리</h1></div><button class="btn primary" id="newJob">+ 새 공고 작성</button></div><p class="form-help">인증된 운영자 계정만 접근할 수 있습니다. 선발 종료 시 해당 공고 지원서를 삭제할 수 있습니다.</p><section class="panel" style="margin-bottom:22px"><div class="panel-head"><h2>업체 공고 등록 요청</h2><span class="count">승인 대기 ${db.requests.filter(r=>r.status==='검토 대기').length}건</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>업체 · 공고명</th><th>담당자</th><th>모집 조건</th><th>상태</th><th>검토</th></tr></thead><tbody>${db.requests.length?db.requests.map(r=>`<tr><td><b>${esc(r.company)}</b><div>${esc(r.title)}</div></td><td>${esc(r.contact)}</td><td>${esc(r.type)} · ${esc(r.seats)}<div>${esc(r.fee)}</div></td><td><span class="pill">${esc(r.status)}</span></td><td>${r.status==='검토 대기'?`<button class="btn small" data-preview-request="${attr(r.id)}">지원서 미리보기</button> <button class="btn small primary" data-approve="${attr(r.id)}">승인 · 게시</button> <button class="btn small" data-reject="${attr(r.id)}">반려</button>`:'처리 완료'}</td></tr>`).join(''):'<tr><td colspan="5" style="text-align:center;padding:24px;color:#7d7890">접수된 업체 공고 요청이 없습니다.</td></tr>'}</tbody></table></div></section><div class="stat-row"><div class="stat"><strong>${db.jobs.filter(j=>j.published).length}</strong><span>게시된 공고</span></div><div class="stat"><strong>${db.jobs.filter(isOpen).length}</strong><span>모집 중</span></div><div class="stat"><strong>${db.apps.length}</strong><span>총 지원</span></div></div><div class="admin-layout"><section class="panel"><div class="panel-head"><h2>공고 관리</h2></div><div class="table-wrap"><table class="data-table"><thead><tr><th>공고명</th><th>유형</th><th>상태</th><th>마감</th><th>지원자</th><th>관리</th></tr></thead><tbody>${db.jobs.map(j=>`<tr><td>${esc(j.title)}</td><td>${esc(j.type)}</td><td><span class="pill ${isOpen(j)?'open':'closed'}">${isOpen(j)?'모집 중':j.published?'마감':'비공개'}</span></td><td>${showDate(j.deadline)}</td><td>${db.apps.filter(a=>a.jobId===j.id).length}명</td><td><button class="btn small" data-job-edit="${attr(j.id)}">편집</button> <button class="btn small" data-job-toggle="${attr(j.id)}">${j.published?'비공개':'게시'}</button> ${!j.closedAt?`<button class="btn danger small" data-finish-job="${attr(j.id)}">선발 종료 · 지원서 삭제</button>`:''}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="panel-head"><h2>지원자 관리</h2><button class="btn ghost small" id="exportCsv">CSV 다운로드</button></div><div style="padding:5px 22px 20px"><div class="admin-controls"><select class="select" id="adminJob"><option value="">공고 선택</option>${db.jobs.map(j=>`<option value="${attr(j.id)}" ${job?.id===j.id?'selected':''}>${esc(j.title)}</option>`).join('')}</select><select id="adminLevel" class="select"><option value="">모든 학교급</option>${SCHOOL_LEVELS.map(x=>`<option ${adminLevel===x?'selected':''}>${x}</option>`).join('')}</select><select id="adminField" class="select"><option value="">모든 희망 분야</option>${(job?.fields||[]).map(x=>`<option ${adminField===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>이름</th><th>학교급</th><th>희망 분야</th><th>대표 경력</th><th>접수일</th><th>선발 결과</th></tr></thead><tbody>${apps.length?apps.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.level)}</td><td>${esc(a.field||'-')}</td><td class="long"><b>${esc(a.activity)}</b><div style="color:#798398">${esc(a.description)}</div>${a.appMessage?`<div style="color:#675d77;white-space:pre-wrap;margin-top:7px"><b>추가 전달 내용:</b> ${esc(a.appMessage)}</div>`:''}</td><td>${showDate(submittedDay(a.submittedAt))}</td><td><select class="select" data-status="${attr(a.id)}"><option ${a.status==='접수 완료'?'selected':''}>접수 완료</option><option ${a.status==='검토 중'?'selected':''}>검토 중</option><option ${a.status==='선발'?'selected':''}>선발</option><option ${a.status==='미선발'?'selected':''}>미선발</option></select></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;color:#8c96a5;padding:30px">해당 조건의 지원자가 없습니다.</td></tr>'}</tbody></table></div></section></div>`}
function normalizedQuestions(j){
  if(Array.isArray(j.questions))return j.questions.filter(q=>q&&q.label);
  const qs=[];
  if(j.secondaryHistory)qs.push({id:'history-major',label:'역사 전공 여부',level:'중등',type:'yesno',required:true,yesOnly:true});
  if(j.extraQuestion?.label)qs.push({id:'legacy-extra',...j.extraQuestion});
  return qs;
}
function qualificationSettings(data={}){
 const qs=normalizedQuestions(data);
 return `<section class="rule-builder"><div class="rule-heading"><h3>교사에게 받을 추가 질문</h3><p>모집 분야에 필요한 질문을 자유롭게 추가할 수 있습니다. 작성한 질문은 공고가 승인되면 교사 지원서에 자동 표시됩니다.</p></div><div class="builder-list" data-questions>${qs.map((q,i)=>questionEditorRow(q,i)).join('')}</div><button type="button" class="btn ghost" data-add-question>＋ 질문 추가하기</button><p class="hint" style="margin-top:12px">질문은 자유롭게 추가하거나 삭제할 수 있습니다. 필수 응답으로 설정하면 지원자가 답해야 제출할 수 있습니다.</p></section>`;
}
function questionEditorRow(q={},i=0){
 const id=q.id||'q'+Date.now()+'-'+i;
 return `<div class="question-editor" data-question-id="${attr(id)}"><div class="question-editor-head"><strong>추가 질문 <span data-question-number>${i+1}</span></strong><button class="btn danger small" type="button" data-remove-question>삭제</button></div><div class="form-group"><div class="question-label-row"><label for="q-${attr(id)}">질문 내용 <span class="req">*</span></label><label class="question-required-toggle"><input type="checkbox" name="customQuestionRequired" ${q.required?'checked':''}> 필수 응답으로 설정</label></div><input id="q-${attr(id)}" class="field" name="customQuestionLabel" maxlength="120" required placeholder="예: 관련 연수 강사 또는 콘텐츠 개발 경험이 있다면 간단히 알려주세요." value="${attr(q.label||'')}"></div></div>`;
}

function bindQuestionBuilder(root=document){
 const list=root.querySelector('[data-questions]');if(!list)return;
 const renumber=()=>list.querySelectorAll('[data-question-number]').forEach((x,i)=>x.textContent=i+1);
 root.querySelector('[data-add-question]')?.addEventListener('click',()=>{const wrap=document.createElement('div');wrap.innerHTML=questionEditorRow({},list.children.length);list.appendChild(wrap.firstElementChild);renumber();list.lastElementChild.querySelector('[name="customQuestionLabel"]').focus()});
 list.addEventListener('click',e=>{const b=e.target.closest('[data-remove-question]');if(!b)return;b.closest('.question-editor').remove();renumber()});
}
function extractQuestionSettings(f,form){
 const questions=[...(form?.querySelectorAll('.question-editor')||[])].map((row,i)=>({id:row.dataset.questionId||('q-'+Date.now()+'-'+i),label:row.querySelector('[name="customQuestionLabel"]').value.trim(),type:'text',level:'전체',required:row.querySelector('[name="customQuestionRequired"]').checked}));
 return {questions,secondaryHistory:false,extraQuestion:null};
}

function applicantQuestionFields(j,f={}){
 const qs=normalizedQuestions(j),answers=f.questionAnswers||{};
 return qs.map(q=>{const value=answers[q.id]??(q.id==='legacy-extra'?f.customAnswer||'':q.id==='history-major'?f.historyMajor||'':'');return `<div class="form-group dynamic-question" data-question-level="${attr(q.level||'전체')}" data-question-required="${q.required?'yes':'no'}" data-question-id="${attr(q.id)}"><label>${esc(q.label)} ${q.required?'<span class="req">*</span>':'<span class="hint">(선택)</span>'}</label>${q.type==='text'?`<input class="field" name="answer_${attr(q.id)}" maxlength="300" value="${attr(value)}" placeholder="답변을 입력해 주세요">`:`<select class="select" name="answer_${attr(q.id)}"><option value="">선택해 주세요</option><option value="예" ${value==='예'?'selected':''}>예</option><option value="아니요" ${value==='아니요'?'selected':''}>아니요</option></select>`}</div>`}).join('');
}
function updateApplicantConditions(form,j){
 const level=form.elements.level?.value||'';
 form.querySelectorAll('.dynamic-question').forEach(row=>{const show=row.dataset.questionLevel==='전체'||row.dataset.questionLevel===level;row.hidden=!show;row.style.display=show?'':'none';const input=row.querySelector('input,select,textarea');if(input){input.required=show&&row.dataset.questionRequired==='yes';input.disabled=!show;}});
}

function companyView(){return `<div class="section-intro"><span class="step-badge">POST A RECRUITMENT</span><h2>모집 공고 정보 입력</h2><p>모집 조건을 입력해 주세요. 티픽스 운영자의 확인 후 공고가 게시됩니다.</p></div><div class="company-wrap"><div class="panel company-form"><div class="panel-head"><h2>모집 공고 등록 요청</h2><span class="pill">업체용</span></div><form id="companyForm" class="detail"><div class="form-group"><label>업체명 <span class="req">*</span></label><input name="company" class="field" required maxlength="80" placeholder="교육 콘텐츠 제작업체명"></div><div class="form-group"><label>담당자 이메일 <span class="req">*</span></label><input type="email" name="contact" class="field" required placeholder="담당자 연락용 이메일"></div><div class="form-group"><label>모집 공고명 <span class="req">*</span></label><input name="title" class="field" required maxlength="120" placeholder="예: 초등 사회과 교육 콘텐츠 제작 교사 모집"></div><div class="form-group"><label>모집 업무 유형 <span class="req">*</span></label><select name="type" class="select">${['연수 강사','콘텐츠 제작·집필','검수·검토','자문위원'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>모집 학교급 <span class="req">*</span></label><div class="flex">${SCHOOL_LEVELS.map(x=>`<label><input type="checkbox" name="levels" value="${x}" ${x==='초등'?'checked':''}> ${x}</label>`).join('')}</div></div><div class="form-group"><label>모집 인원 <span class="req">*</span></label><input name="seats" class="field" required placeholder="예: 초등 3명 · 중등 3명"></div><div class="form-group"><label>사례비 및 산정 기준 <span class="req">*</span></label><input name="fee" class="field" required placeholder="예: 차시당 50만 원 (세전)"></div><div class="form-group"><label>진행 일정 <span class="req">*</span></label><input name="period" class="field" required placeholder="예: 2027년 2~3월"></div><div class="form-group"><label>지원 마감일 <span class="req">*</span></label><input type="date" name="deadline" class="field" required min="${today()}"></div><div class="form-group"><label>업무 및 결과물 <span class="req">*</span></label><textarea name="tasks" function spaceNav(){if(page==='admin'||page==='home')return '';let teacher=['jobs','mine'].includes(page);return `<nav class="space-tabs" aria-label="${teacher?'선생님':'업체'} 공간 메뉴"><div class="space-tabs-inner"><a href="#home" class="space-tabs-title" data-nav="home" aria-label="홈으로 돌아가기">← 홈으로</a><div class="space-tab-links">${teacher?`<button type="button" class="space-tab ${page==='jobs'?'on':''}" data-nav="jobs">모집 공고 찾기</button><button type="button" class="space-tab ${page==='mine'?'on':''}" data-nav="mine">내 지원 내역</button>`:`<button type="button" class="space-tab ${page==='partner'?'on':''}" data-nav="partner">내 모집 관리</button><button type="button" class="space-tab ${page==='company'?'on':''}" data-nav="company">새 공고 등록</button>`}</div></div></nav>`}
function partnerView(){const requests=[...db.requests].reverse();const jobs=db.jobs.filter(j=>j.sourceRequestId&&requests.some(r=>r.id===j.sourceRequestId));const total=jobs.reduce((n,j)=>n+db.apps.filter(a=>a.jobId===j.id).length,0);return `<div class="section-intro"><span class="step-badge">PARTNER DASHBOARD</span><h2>내 모집 관리</h2><p>공고 등록부터 승인 현황과 지원자 현황까지 확인하세요. 구글로 로그인한 담당자의 모집 내역이 표시됩니다.</p></div><div class="partner-summary"><div><span>등록 요청</span><strong>${requests.length}<small>건</small></strong></div><div><span>승인된 공고</span><strong>${jobs.length}<small>건</small></strong></div><div><span>전체 지원자</span><strong>${total}<small>명</small></strong></div></div><div class="partner-heading"><h3>등록한 공고</h3><button type="button" class="btn primary" data-nav="company">+ 새 공고 등록</button></div>${requests.length?`<div class="partner-list">${requests.map(r=>{const j=jobs.find(j=>j.sourceRequestId===r.id);const number=j?db.apps.filter(a=>a.jobId===j.id).length:0;return `<article class="partner-item"><div class="partner-item-top"><span class="pill ${j?'open':''}">${esc(r.status)}</span><span class="my-meta">${showDate(submittedDay(r.submittedAt))} 등록</span></div><h3>${esc(r.title)}</h3><p>${esc(r.company)} · ${esc(r.type)} · 마감 ${showDate(r.deadline)}</p><div class="partner-item-foot"><span>지원자 <strong>${number}명</strong></span>${j?`<button class="btn small" data-partner-apps="${attr(j.id)}">지원자 확인 ↗</button>`:`<span class="my-meta">${r.status==='반려'?'수정한 뒤 다시 등록해 주세요.':'운영자 검토 후 공개됩니다.'}</span>`}${!j?`<button type="button" class="btn small" data-request-edit="${attr(r.id)}">수정하기</button><button type="button" class="btn danger small" data-request-cancel="${attr(r.id)}">등록 취소</button>`:''}</div></article>`}).join('')}</div>`:`<div class="panel empty">아직 등록한 공고가 없습니다.<br><br><button type="button" class="btn primary" data-nav="company">첫 모집 공고 등록하기</button></div>`}<p class="form-help">해당 공고에 지원한 선생님의 정보만 확인할 수 있습니다. 선발 목적으로만 사용해 주세요.</p>`}
function partnerApplicants(id){const j=db.jobs.find(j=>j.id===id);if(!j)return;const apps=db.apps.filter(a=>a.jobId===id);modal(`<div class="partner-applicants"><div class="flex" style="justify-content:space-between"><span class="step-badge">APPLICANTS</span><button type="button" class="modal-close" id="closePartner" aria-label="닫기">×</button></div><h2>${esc(j.title)}</h2><p>지원자 ${apps.length}명 · 제출된 대표 경력을 확인할 수 있습니다.</p>${apps.length?apps.map(a=>`<div class="partner-app"><div class="flex"><strong>${esc(a.name)}</strong><span class="my-meta">${esc(a.phone||'')} · ${esc(a.email||'')}</span><span class="pill">${esc(a.level)} · ${esc(a.field||'공통')}</span><span class="pill">${esc(a.status)}</span></div><div class="partner-app-body"><b>${esc(a.activity)}</b><p>${esc(a.description)}</p>${normalizedQuestions(j).filter(q=>a.questionAnswers?.[q.id]).map(q=>`<p>${esc(q.label)}: ${esc(a.questionAnswers[q.id])}</p>`).join('')}${a.additional?`<p>관련 이력: ${esc(a.additional)}</p>`:``}${a.books?`<p>저서: ${esc(a.books)}</p>`:``}${a.snsName?`<p>SNS: ${esc(a.snsName)}${a.snsUrl?` · ${esc(a.snsUrl)}`:``}</p>`:``}${a.appMessage?`<p style="white-space:pre-wrap"><b>지원 동기 및 자기소개:</b> ${esc(a.appMessage)}</p>`:``}</div></div>`).join(''):'<div class="empty">아직 지원자가 없습니다.</div>'}</div>`);el('closePartner').onclick=closeModal}
function render(){el('root').innerHTML=(page==='home'?brandHero():'')+spaceNav()+`<div class="content-wrap ${page==='admin'?'admin-content':''}">`+(page==='home'?homeView():page==='jobs'?jobsView():page==='mine'?myView():page==='company'?companyView():page==='partner'?partnerView():adminView())+'</div>';ensureFieldLabels(el('root'));bind()}
function ensureFieldLabels(scope){scope.querySelectorAll('.form-group').forEach(group=>{const fields=group.querySelectorAll('input:not([type=checkbox]),textarea,select');const label=group.querySelector('label');if(!label)return;fields.forEach((field,i)=>{if(!field.id)field.id='f-'+Math.random().toString(36).slice(2,11);if(i===0){label.htmlFor=field.id}else if(!field.getAttribute('aria-label'))field.setAttribute('aria-label',label.textContent.trim()+' '+(i+1))})})}
const DRAFT_PREFIX='tpicks_recruit_application_draft_v1_';
let modalContext=null, modalReturnFocus=null, suppressPopConfirm=false;
function draftKey(jobId){return DRAFT_PREFIX+(recruitUser?.email||"anonymous")+":"+jobId}
function getDraft(jobId){try{return JSON.parse(sessionStorage.getItem(draftKey(jobId))||'null')}catch(_){return null}}
function clearDraft(jobId){try{sessionStorage.removeItem(draftKey(jobId))}catch(_){}}
function serializeDraft(form){
 const values={};form.querySelectorAll('[name]').forEach(field=>{
  if(field.type==='checkbox'){if(!values[field.name])values[field.name]=[];if(field.checked)values[field.name].push(field.value||'on')}
  else if(field.type==='radio'){if(field.checked)values[field.name]=field.value}
  else values[field.name]=field.value;
 });return values;
}
function restoreDraft(form,values){if(!values)return;form.querySelectorAll('[name]').forEach(field=>{
 const saved=values[field.name];if(saved===undefined)return;
 if(field.type==='checkbox')field.checked=Array.isArray(saved)&&saved.includes(field.value||'on');
 else if(field.type==='radio')field.checked=saved===field.value;
 else field.value=saved;
 });
}
function saveApplicationDraft(){
 if(modalContext?.kind!=='application')return;
 const form=el('appForm');if(!form)return;
 try{sessionStorage.setItem(draftKey(modalContext.jobId),JSON.stringify({values:serializeDraft(form),savedAt:Date.now()}));const state=el('draftSaveStatus');if(state)state.textContent='✓ 이 탭에 임시저장되었습니다.'}catch(_){const state=el('draftSaveStatus');if(state)state.textContent='임시저장 실패 · 입력 내용을 확인해 주세요.'}
}
function hasDirtyApplication(){return modalContext?.kind==='application' && !!el('appForm') && serializeDraft(el('appForm')) && JSON.stringify(serializeDraft(el('appForm')))!==modalContext.initialSnapshot}
function allowLeaveModal(){if(!hasDirtyApplication())return true;saveApplicationDraft();return confirm('작성 중인 지원서가 있습니다. 임시저장하고 나가시겠어요?\n이 탭에서 다시 열면 불러올 수 있습니다.')}
function focusableWithin(dialog){return [...dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.getClientRects().length&&x.getAttribute('aria-hidden')!=='true')}
function trapModalFocus(e){const dialog=el('modalRoot')?.querySelector('[role="dialog"]');if(!dialog||e.key!=='Tab')return;const list=focusableWithin(dialog);if(!list.length){e.preventDefault();dialog.focus();return}const first=list[0],last=list.at(-1);if(e.shiftKey && (document.activeElement===first || !dialog.contains(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey && (document.activeElement===last||!dialog.contains(document.activeElement))){e.preventDefault();first.focus()}}
function assignModalContext(kind,jobId=null){modalContext={kind,jobId,initialSnapshot:''}}

function modal(html){
 const existing=!!el('modalRoot').firstElementChild;
 if(!existing){modalReturnFocus=document.activeElement;history.pushState({overlay:true,page},'',location.href)}
 else if(!allowLeaveModal())return false;
 modalContext=null;
 document.body.classList.add('modal-open');
 el('modalRoot').innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="상세 정보 및 입력창" tabindex="-1">${html}</div></div>`;
 ensureFieldLabels(el('overlay'));
 el('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
 const dialog=el('overlay').querySelector('[role="dialog"]');
 (focusableWithin(dialog)[0]||dialog).focus({preventScroll:true});
 return true;
}
function clearModalUI(){el('modalRoot').innerHTML='';document.body.classList.remove('modal-open');editId=null;modalContext=null;if(modalReturnFocus?.isConnected)modalReturnFocus.focus({preventScroll:true});modalReturnFocus=null}
function closeModal(options={}){
 if(!el('modalRoot').firstElementChild)return true;
 if(!options.force && !allowLeaveModal())return false;
 clearModalUI();
 // X/ESC 닫기에서 비동기 history.back()을 쓰면 즉시 누른 상단 메뉴 이동과 경합하므로 현재 기록을 바로 정규화합니다.
  if(!options.skipHistory && history.state?.overlay)history.replaceState({page},'',location.href);
 return true;
}
function shareInfo(id){const j=db.jobs.find(x=>x.id===id);if(!j)return null;const url=(location.protocol==='https:'||location.protocol==='http:')?`${location.origin}${location.pathname}${location.search}#job-${encodeURIComponent(id)}`:'';const text=`${j.title}\n${j.company}\n모집 대상: ${j.levels.join(' · ')}\n사례비: ${j.fee}\n마감일: ${showDate(j.deadline)}`;return {j,url,text};}
// 실제 티픽스 배포 시 Kakao Developers JavaScript 키와 허용 도메인을 등록해 주세요.
// 설정 예: window.TPICKS_KAKAO_JS_KEY = 'Kakao Developers에서 발급한 JavaScript 키';
async function shareToKakao(id){
 const v=shareInfo(id);if(!v)return;
 if(!v.url){toast('로컬 HTML에는 공유할 웹주소가 없습니다. 사이트 배포 후 이용할 수 있습니다.');return}
 const key=window.TPICKS_KAKAO_JS_KEY||'';
 if(key){
  try{
   if(!window.Kakao){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://t1.kakaocdn.net/kakao_js_sdk/2.7.7/kakao.min.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)})}
   if(!window.Kakao.isInitialized())window.Kakao.init(key);
   window.Kakao.Share.sendDefault({objectType:'text',text:v.j.title+' · '+v.j.company,link:{mobileWebUrl:v.url,webUrl:v.url}});
   return;
  }catch(e){console.warn('카카오톡 직접 공유 실패',e)}
 }
 // SDK 키가 없을 때: 안드로이드는 카카오톡 공유 화면을 바로 엽니다(카톡 인앱 브라우저처럼 공유 메뉴가 없는 곳 포함).
 if(/Android/i.test(navigator.userAgent)){
  location.href='intent:#Intent;action=android.intent.action.SEND;type=text/plain;S.android.intent.extra.TEXT='+encodeURIComponent(v.text+'\n'+v.url)+';package=com.kakao.talk;end';
  setTimeout(()=>{if(!document.hidden)toast('카카오톡이 열리지 않으면 「공고 링크 복사」를 눌러 붙여 넣어 주세요.')},1800);
  return;
 }
 // 그 밖의 기기는 휴대폰 공유 메뉴에서 카카오톡을 고릅니다.
 if(navigator.share){try{await navigator.share({title:v.j.title,url:v.url})}catch(e){if(e.name!=='AbortError')toast('공유 메뉴를 열지 못했습니다. 링크 복사를 이용해 주세요.')}}
 else copyJobLink(id);
}
function shareJob(id){

async function copyJobLink(id){const j=db.jobs.find(x=>x.id===id);if(!j)return;const hosted=location.protocol==='https:'||location.protocol==='http:';const link=hosted?`${location.origin}${location.pathname}${location.search}#job-${encodeURIComponent(id)}`:`${j.title}\n${j.company}\n모집 대상: ${j.levels.join(' · ')}\n사례비: ${j.fee}\n마감: ${showDate(j.deadline)}\n(공개 배포 전이라 링크 대신 공고 내용을 복사합니다)`;try{await navigator.clipboard.writeText(link);toast(hosted?'공고 링크를 복사했습니다.':'공고 내용을 복사했습니다.')}catch(e){const t=document.createElement('textarea');t.value=link;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('복사했습니다.')}}

function jobEditor(id){let j=db.jobs.find(x=>x.id===id),newJ=!j;let data=j||{title:'',company:'',type:'콘텐츠 제작·집필',levels:['초등'],seats:'',fee:'',deadline:'2027-03-31',period:'',summary:'',tasks:'',qualification:'',process:'지원 → 검토 → 결과 안내',feeDetail:'',fields:[],secondaryHistory:false,extraQuestion:null,questions:[],published:false};modal(`<h2>${newJ?'새 모집 공고':'공고 편집'}</h2><p>필수 정보를 입력한 뒤 저장해 주세요.</p><form id="jobForm">${[['title','공고명'],['company','의뢰 업체'],['seats','모집 인원'],['fee','사례비'],['period','진행 일정'],['summary','한 줄 설명'],['qualification','지원 자격'],['feeDetail','사례비 산정 기준']].map(([k,l])=>`<div class="form-group"><label>${l}</label><input name="${k}" class="field" value="${attr(data[k])}" ${['title','company','seats','period'].includes(k)?'required':''}></div>`).join('')}<div class="form-group"><label>업무 유형</label><select class="select" name="type">${['연수 강사','콘텐츠 제작·집필','검수·검토','자문위원'].map(x=>`<option ${x===data.type?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>모집 학교급</label><div class="flex">${SCHOOL_LEVELS.map(x=>`<label><input type="checkbox" name="levels" value="${x}" ${data.levels.includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><div class="form-group"><label>마감일</label><input class="field" type="date" name="deadline" required value="${attr(data.deadline)}"></div><div class="form-group"><label>업무와 결과물</label><textarea class="textarea" name="tasks">${esc(data.tasks)}</textarea></div><div class="form-group"><label>지원서 희망 분야 (쉼표로 구분, 없으면 비워 두기)</label><input class="field" name="fields" value="${attr(data.fields.join(', '))}"></div>${qualificationSettings(data)}<div class="form-group"><label>선발 절차</label><input name="process" class="field" value="${attr(data.process)}" placeholder="지원서 검토 후 개별 안내"></div><div class="form-group"><label>추가 안내 사항 (선택)</label><textarea name="additionalDetails" class="textarea" rows="5" maxlength="4000" placeholder="공고에 표시할 상세 안내">${esc(data.additionalDetails||'')}</textarea></di function exportCsv(){let rows=db.apps.filter(a=>a.jobId===adminJob&&(!adminLevel||a.level===adminLevel)&&(!adminField||a.field===adminField));if(!rows.length){toast('내보낼 지원자가 없습니다.');return}const header=['공고명','성함','연락처','이메일','학교급','희망 분야','추가 질문 및 답변','활동명','맡은 일','지원 분야 관련 이력','저서','SNS 채널명','SNS 링크','포트폴리오','지원 동기 및 자기소개','접수 일시','상태'];let csv='\ufeff'+[header,...rows.map(a=>[db.jobs.find(j=>j.id===a.jobId)?.title,a.name,a.phone||'',a.email||'',a.level,a.field,normalizedQuestions(db.jobs.find(j=>j.id===a.jobId)||{}).map(q=>q.label+': '+(a.questionAnswers?.[q.id]|| (q.id==='history-major'?a.historyMajor||'':q.id==='legacy-extra'?a.customAnswer||'':''))).join(' / '),a.activity,a.description,a.additional,a.books,a.snsName,a.snsUrl,a.portfolio,a.appMessage||'',kstDateTime(a.submittedAt),a.status])].map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='tpicks_지원자_'+today()+'.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV 파일을 다운로드했습니다. 구글 시트에서 가져올 수 있습니다.')}

function previewRequest(id){const r=db.requests.find(x=>x.id===id);if(!r)return;const draft={...r,id:'preview',published:true};modal(`<div class="flex" style="justify-content:space-between;align-items:center"><h2>업체 공고 · 지원서 미리보기</h2><button class="modal-close" id="closePreview">×</button></div><p class="form-help">업체가 등록한 설정이 승인 후 교사 지원서에 그대로 적용됩니다.</p><div class="preview-rules"><b>${esc(r.title)}</b><p>학교급: ${esc(r.levels.join(' · '))}</p><p>희망 분야: ${esc((r.fields||[]).join(' · ')||'선택 없음')}</p><p>추가 질문: ${normalizedQuestions(r).length}개</p>${normalizedQuestions(r).map(q=>`<p>· ${esc(q.label)} (${esc(q.level||'전체')}, ${q.required?'필수':'선택'}, ${q.type==='text'?'짧은 글':'예/아니요'})</p>`).join('')}</div>${applicationForm(draft,null).replace('<form id="appForm"','<form id="previewForm"')}`);el('closePreview').onclick=closeModal;const f=el('previewForm');f.addEventListener('submit',e=>{e.preventDefault();toast('미리보기에서는 제출되지 않습니다.')});f.elements.level.addEventListener('change',()=>updateApplicantConditions(f,draft));updateApplicantConditions(f,draft);f.querySelector('#cancelApply')?.addEventListener('click',closeModal)}

function navigate(target){
 const fromOverlay=!!history.state?.overlay,url='#'+target;
 // 모달을 닫을 때 history.back()을 쓰면 이동이 끝난 뒤에 뒤로가기가 실행되어 이전 화면으로 되돌아가므로,
 // 모달 기록은 목적지 화면 기록으로 바꿔 씁니다.
 if(!closeModal({skipHistory:true}))return;
 if(fromOverlay){if(target===page)history.back();else history.replaceState({page:target},'',url)}
 else if(target!==page||location.hash!==url)history.pushState({page:target},'',url);
 page=target;render();window.scrollTo({top:0,behavior:'instant'});
}
const currentHash=()=>decodeURIComponent(location.hash.slice(1))||'home';
function syncLocation(){
 editingRequestId=null;
 const hash=decodeURIComponent(location.hash.slice(1));
 if(hash.startsWith('job-')){clearModalUI();history.replaceState({page:'jobs'},'','#jobs');page='jobs';render();openJobDetails(hash.slice(4));return}
 const target=['home','jobs','mine','company','partner','admin'].includes(hash)?hash:'home';
 clearModalUI();page=target;render();window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('hashchange',()=>{if(history.state?.overlay||currentHash()===page)return;syncLocation()});
window.addEventListener('popstate',e=>{
 if(el('modalRoot').firstElementChild){
  if(!allowLeaveModal()){
   history.pushState({overlay:true,page},'',location.href);
   return;
  }
  clearModalUI();
  if(!e.state?.overlay && location.hash!=='#'+page)syncLocation();
  return;
 }
 if(e.state?.overlay){history.replaceState({page},'', '#'+page);return}
 if(currentHash()===page)return;
 syncLocation();
});
